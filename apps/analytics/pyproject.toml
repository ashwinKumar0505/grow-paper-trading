[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradedia-screener-backend"
version = "2.0.0"
description = "Tradedia NSE Stock Market Analytics, Rule-Based Screener, and Walk-Forward Backtesting API (FastAPI)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Quant Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pytz>=2024.1",
    "cachetools>=5.3.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
